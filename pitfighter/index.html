<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Strong anti-zoom hint (iOS still needs JS guard below) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Stick Fighter</title>
  <style>
    html, body {
      margin:0; height:100%;
      background:#111; color:#ddd;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    * { -webkit-tap-highlight-color: rgba(0,0,0,0); }

    .wrap {
      display:flex; flex-direction:column; align-items:center;
      gap:10px; padding:10px; position:relative;
      min-height:100vh; box-sizing:border-box;
    }

    canvas {
      background:#1b1b1b;
      border:1px solid #333;
      border-radius:10px;
      height: calc(100vh - 250px);
      width: auto;
      max-width: 96vw;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .hud { width:min(960px, 96vw); display:flex; justify-content:space-between; gap:12px; }
    .panel { flex:1; }
    .row { display:flex; justify-content:space-between; margin-bottom:6px; }
    .bar { background:#222; border:1px solid #333; border-radius:999px; overflow:hidden; height:16px; }
    .bar.small { height:10px; margin-top:6px; }
    .fill { height:100%; width:100%; }
    .p1 { background:#3aa0ff; }
    .p2 { background:#ff4b4b; }
    .m1 { background:#7cff8a; }
    .m2 { background:#ffe07a; }

    .hint { width:min(960px, 96vw); font-size:14px; line-height:1.35; opacity:.9; }
    .kbd { padding:2px 6px; border:1px solid #444; border-bottom-width:2px; border-radius:6px; background:#191919; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    .overlay {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
      z-index: 10;
      touch-action: none;
    }
    .card {
      width:min(520px, 92vw);
      background:#141414;
      border:1px solid #333;
      border-radius:16px;
      padding:18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .title { font-weight:800; font-size:22px; margin:0 0 10px 0; }
    .sub { opacity:0.9; margin:0 0 14px 0; }
    .btnrow { display:flex; gap:10px; flex-wrap:wrap; }
    button.big {
      appearance:none;
      border:1px solid #3a3a3a;
      background:#1f1f1f;
      color:#eee;
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:800;
      touch-action: manipulation;
    }
    button.big:hover { background:#252525; }
    button.primary { border-color:#4a8dff; }
    .hidden { display:none !important; }
    .smallnote { margin-top:10px; font-size:13px; opacity:0.85; }

    /* Floating reset: always visible */
    #btnReset {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10000;
      width: 56px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,20,20,0.55);
      color:#eee;
      font-weight: 900;
      font-size: 18px;
      display:grid;
      place-items:center;
      backdrop-filter: blur(6px);
      -webkit-user-select:none;
      user-select:none;
      touch-action: manipulation;
    }
    #btnReset:active { transform: translateY(1px); background: rgba(30,30,30,0.65); }

    #buildStamp {
      position: fixed;
      right: 10px;
      bottom: 10px;
      padding: 6px 10px;
      border: 1px solid #444;
      background: #111;
      border-radius: 10px;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #bbb;
      opacity: 0.92;
      z-index: 9999;
    }

    /* Touch controls overlay */
    #touchControls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      touch-action: none;
    }
    .touchPad, .touchBtns {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 12px;
      pointer-events: none;
    }
    .touchPad { left: 14px; }
    .touchBtns { right: 14px; }

    .tbtn {
      pointer-events: auto;
      width: 74px;
      height: 74px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,20,20,0.55);
      color: #eee;
      font-weight: 900;
      font-size: 18px;
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    .tbtn:active { transform: translateY(1px); background: rgba(30,30,30,0.65); }
    .dcol { display:flex; flex-direction:column; gap:12px; }
    .drow { display:flex; gap:12px; }

    @media (pointer: fine) {
      #touchControls { display:none; }
    }
  </style>
</head>
<body>
  <button id="btnReset" aria-label="Reset">↻</button>

  <div class="wrap">
    <div id="menuOverlay" class="overlay">
      <div class="card">
        <div id="menuMode">
          <p class="title">Stick Fighter</p>
          <p class="sub">Choose mode</p>
          <div class="btnrow">
            <button id="btn1p" class="big primary">1 Player</button>
            <button id="btn2p" class="big">2 Player</button>
          </div>
          <div class="smallnote">Tip: Tap the canvas once so it captures input.</div>
        </div>

        <div id="menuDifficulty" class="hidden">
          <p class="title">1 Player</p>
          <p class="sub">Choose difficulty</p>
          <div class="btnrow">
            <button id="btnEasy" class="big primary">Easy</button>
            <button id="btnMedium" class="big">Medium</button>
            <button id="btnHard" class="big">Hard</button>
          </div>
        </div>
      </div>
    </div>

    <div class="hud">
      <div class="panel">
        <div class="row"><div>Blue</div><div id="p1hpText">100</div></div>
        <div class="bar"><div id="p1hp" class="fill p1"></div></div>
        <div class="row" style="margin-top:8px;"><div>Meter</div><div id="p1mText">0</div></div>
        <div class="bar small"><div id="p1m" class="fill m1"></div></div>
      </div>

      <div class="panel">
        <div class="row"><div>Red</div><div id="p2hpText">100</div></div>
        <div class="bar"><div id="p2hp" class="fill p2"></div></div>
        <div class="row" style="margin-top:8px;"><div>Meter</div><div id="p2mText">0</div></div>
        <div class="bar small"><div id="p2m" class="fill m2"></div></div>
      </div>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <div class="hint">
      Blue jump = <span class="kbd">W</span>. Red jump = <span class="kbd">↑</span>.
      Reset = <span class="kbd">R</span> or Joy-Con <span class="kbd">+</span> or ↻ button.
    </div>
  </div>

  <div id="touchControls">
    <div class="touchPad">
      <div class="dcol">
        <div class="drow"><div class="tbtn" data-action="up">↑</div></div>
        <div class="drow">
          <div class="tbtn" data-action="left">←</div>
          <div class="tbtn" data-action="right">→</div>
        </div>
      </div>
    </div>

    <div class="touchBtns">
      <div class="tbtn" data-action="punch">P</div>
      <div class="tbtn" data-action="kick">K</div>
      <div class="tbtn" data-action="special">★</div>
    </div>
  </div>

  <div id="buildStamp">BUILD: (loading...)</div>
  <script type="module" src="./js/main.js?v=menu6"></script>
</body>
</html>
